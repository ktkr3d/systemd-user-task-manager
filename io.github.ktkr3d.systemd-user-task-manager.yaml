app-id: io.github.ktkr3d.systemd-user-task-manager
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: systemd-user-task-manager
finish-args:
    - --share=ipc
    - --socket=fallback-x11
    - --socket=wayland
    - --device=dri
    - --talk-name=org.freedesktop.systemd1
    - --filesystem=home/.config/systemd/user:create
    - --talk-name=org.freedesktop.Flatpak
modules:
    - name: python3-dependencies
      buildsystem: simple
      build-commands:
          - pip3 install --prefix=${FLATPAK_DEST} PyGObject

    - name: systemd-user-task-manager
      buildsystem: simple
      build-options:
          build-args:
              - --share=network
      build-commands:
          - pip3 install --prefix=${FLATPAK_DEST} .
          # Desktopファイル、アイコン、Metainfoを明示的にインストール
          - install -Dm644 io.github.ktkr3d.systemd-user-task-manager.desktop ${FLATPAK_DEST}/share/applications/io.github.ktkr3d.systemd-user-task-manager.desktop
          - install -Dm644 io.github.ktkr3d.systemd-user-task-manager.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.ktkr3d.systemd-user-task-manager.svg
          - install -Dm644 io.github.ktkr3d.systemd-user-task-manager.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.ktkr3d.systemd-user-task-manager.metainfo.xml
      sources:
          - type: dir
            path: .
