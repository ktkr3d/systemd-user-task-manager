[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemd-user-task-manager"
version = "0.1.0"
description = "Systemd user task manager with GTK4"
dependencies = [
    "PyGObject",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
artifacts = [
    "locale/**/*.mo",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[project.scripts]
systemd-user-task-manager = "main:main"