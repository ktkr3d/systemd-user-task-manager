[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemd-user-task-manager"
dynamic = ["version"]
description = "Systemd user task manager with GTK4"
dependencies = [
    "PyGObject",
]

[tool.hatch.version]
path = "manager.py"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "manager.py",
    "app_window.py",
    "task_dialog.py",
]
artifacts = [
    "locale/**/*.mo",
    "io.github.ktkr3d.systemd-user-task-manager.desktop",
    "io.github.ktkr3d.systemd-user-task-manager.svg",
    "io.github.ktkr3d.systemd-user-task-manager.metainfo.xml",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[project.scripts]
systemd-user-task-manager = "main:main" # アプリケーション本体の実行