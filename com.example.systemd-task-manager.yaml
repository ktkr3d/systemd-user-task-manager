app-id: com.example.systemd-task-manager
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: systemd-user-task-manager
finish-args:
    - --share=ipc
    - --socket=fallback-x11
    - --socket=wayland
    - --device=dri
    - --talk-name=org.freedesktop.systemd1
    - --filesystem=home/.config/systemd/user:create
modules:
    - name: python3-dependencies
      buildsystem: simple
      build-commands:
          - pip3 install --prefix=${FLATPAK_DEST} PyGObject

    - name: systemd-user-task-manager
      buildsystem: simple
      build-options:
          build-args:
              - --share=network
      build-commands:
          - pip3 install --prefix=${FLATPAK_DEST} .
          - install -Dm644 com.example.systemd-task-manager.desktop ${FLATPAK_DEST}/share/applications/com.example.systemd-task-manager.desktop
          - install -Dm644 com.example.systemd-task-manager.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.example.systemd-task-manager.svg
          - install -Dm644 com.example.systemd-task-manager.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.example.systemd-task-manager.metainfo.xml
      sources:
          - type: dir
            path: .
